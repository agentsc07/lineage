org: "Apollo Health AI"
environments:
  dev: { min_trust: unknown, max_risk: 70 }
  staging: { min_trust: origin_verified, max_risk: 40 }
  prod: { min_trust: origin_verified, max_risk: 25 }
publishers:
  allow: ["nvidia", "meta-llama", "BerriAI", "apollo-health", "huggingface"]
  block: ["*-official-mirror"]
licences_allowed: ["apache-2.0", "mit", "bsd-3-clause", "llama3.1", "nvidia-open-model-license"]
cooldown_days: { package: 3, model: 7, dataset: 7, tool: 7 }
banned_capabilities: ["network_at_install", "startup_hook", "dynamic_exec_of_remote_code"]
max_vuln_severity: { prod: "medium", dev: "high" }
require_human_approval: ["tool", "model:prod"]
model_files: { allow_pickle: false }
data: { pii_allowed: false, residency: ["IN", "EU"] }
thresholds: { allow: 30, quarantine: 70 }   # above 70 -> block
exceptions: []                              # {artifact, approver, reason, expires}
compliance_map:
  "NIST-AI-RMF:MAP-4.1": ["provenance"]
  "ISO42001:A.7.5": ["data"]
unrun_checks:                               # what a check that could not run costs, per environment
  default: { dev: info, staging: medium, prod: high }
  ACQUIRE: { dev: critical, staging: critical, prod: critical }
  WEIGHT_BACKDOOR: { dev: info, staging: low, prod: medium }
  PARENT_ID: { dev: info, staging: low, prod: medium }     # same family as the GPU checks: no admitted model to compare with
  BEHAVIOUR_DIFF: { dev: info, staging: low, prod: medium }
  POLICY_CHECK: { dev: info, staging: info, prod: low }   # the card-vs-policy check needs the hosted API key
trusted_publishers: []                      # {name, key (ed25519 hex), scope: ["hf:org/*", "pypi:name-*", "upload:*"]}
revoked_keys: []                            # key ids
