[project]
name = "lineage"
version = "0.1.0"
description = "Admission control for AI artifacts: identify, verify, inspect, decide, bind, watch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "cryptography>=42",
    "safetensors>=0.4.2",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
lineage = "lineage.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lineage", "lineage_server", "mcp_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
