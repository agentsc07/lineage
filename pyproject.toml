[project]
name = "lineage"
version = "0.1.0"
description = "Admission control for AI artifacts: identify, verify, inspect, decide, bind, watch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "cryptography>=42",
    "safetensors>=0.4.2",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "scikit-learn>=1.9.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
# GPU worker (Track D). Versions match the Brev L40S environment (driver 565 / CUDA 12.7 -> torch cu126 wheels).
gpu = [
    "torch==2.14.1",
    "transformers==5.19.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "datasets==5.1.0",
    "huggingface-hub==2.3.0",
    "sentencepiece==0.2.2",
    "tokenizers==0.23.3",
]

[project.scripts]
lineage = "lineage.cli:app"

[dependency-groups]
dev = [
    "pip>=26.2.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lineage", "lineage_server", "mcp_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
torch = { index = "pytorch-cu126", extra = "gpu" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
